name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_TIMESTEPS: 2000
      FINETUNE_TIMESTEPS: 1000
      NUM_TRAJECTORY_PAIRS: 10
      TRAJECTORY_LENGTH: 50
      REWARD_MODEL_EPOCHS: 2
      REWARD_MODEL_ENSEMBLE_SIZE: 2

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install system dependencies for Box2D
        run: |
          sudo apt-get update
          sudo apt-get install -y swig build-essential

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install swig
          pip install -r requirements.txt
          pip install "gymnasium[box2d]" tensorboard

      - name: Verify Box2D
        run: python -c "import Box2D; print('Box2D OK')"

      - name: Sanity check environment
        run: python 0_sanity_check.py

      - name: Smoke-test base agent training
        run: |
          python -c "
          from base_agent.train import train_base_agent
          train_base_agent()
          "

      - name: Smoke-test preference collection
        run: |
          python -c "
          from preference_collection.generate_pairs import build_preference_dataset
          build_preference_dataset()
          "

      - name: Smoke-test reward model training
        run: |
          python -c "
          from reward_model.train_reward_model import train_reward_model_ensemble
          train_reward_model_ensemble()
          "

      - name: Smoke-test RLHF fine-tuning
        run: |
          python -c "
          from rlhf_finetune.finetune import finetune_with_rlhf
          finetune_with_rlhf()
          "

      - name: Smoke-test evaluation
        run: |
          python -c "
          import matplotlib
          matplotlib.use('Agg')
          from eval.compare_agents import compare_agents
          compare_agents()
          "